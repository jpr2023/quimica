<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invasión de Cangrejos Químicos - Mar Profundo</title>
    <style>
        body {
            margin: 0;
            background-color: #050b14;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }
        canvas {
            background-color: #0a1e3f; /* Azul mar profundo */
            border: 4px solid #1a3a6d;
            box-shadow: 0 0 30px rgba(0, 165, 255, 0.3);
            cursor: pointer;
        }
    </style>
</head>
<body>

<canvas id="gameCanvas" width="800" height="600"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// --- CONFIGURACIÓN Y VARIABLES ---
const FPS = 60;
let keys = {};

// Colores
const HERO_BLUE = "#3296FF";
const YELLOW = "#FFFF00";
const RED = "#FF4444";
const GREEN = "#32FF32";
const WHITE = "#FFFFFF";
const ORANGE = "#FFA500";
const RUST = "#D2691E";
const CYAN = "#00FFFF";

// Variables globales del juego
let nivel = 1;
let score = 0;
let enemiesDestroyed = 0;
let hDestroyed = 0;
let cDestroyed = 0;
let feDestroyed = 0;

let enemyDirection = 1;
let enemySpeed = 2;
const enemyDrop = 15;

// Estados del juego
let inStartMenu = true; // Estado para la pantalla de inicio
let gameOver = false;
let gameFinished = false;
let inTransition = false;

// Botón de Inicio (Propiedades en Canvas)
const startButton = {
    x: 280,
    y: 420,
    width: 240,
    height: 50
};

// Tiempos (en milisegundos)
let transitionTimer = 0;
const TRANSITION_DURATION = 10000; 
let levelStartTime = 0;
const LEVEL_DURATION = 20000; // 20 segundos
let nivelCompletadoAnterior = 0;

// Burbujas de fondo (Efecto Mar)
let bubbles = [];
for (let i = 0; i < 30; i++) {
    bubbles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: Math.random() * 3 + 1,
        speed: Math.random() * 1 + 0.5
    });
}

// --- CLASES EN FORMATO GRÁFICO CON IDENTIFICADORES ---

class Player {
    constructor() {
        this.width = 44;
        this.height = 38;
        this.x = canvas.width / 2 - this.width / 2;
        this.y = canvas.height - 55;
        this.speed = 6;
    }

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);

        // Cuerpo de la nave (Triángulo principal)
        ctx.fillStyle = HERO_BLUE;
        ctx.beginPath();
        ctx.moveTo(this.width / 2, 0); 
        ctx.lineTo(0, this.height);    
        ctx.lineTo(this.width, this.height); 
        ctx.closePath();
        ctx.fill();

        // Alas laterales
        ctx.fillStyle = CYAN;
        ctx.fillRect(-6, this.height - 15, 6, 15);
        ctx.fillRect(this.width, this.height - 15, 6, 15);

        // Cabina ampliada para contener la letra "O"
        ctx.fillStyle = "#111122";
        ctx.beginPath();
        ctx.arc(this.width / 2, this.height / 2 + 5, 10, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = WHITE;
        ctx.lineWidth = 1;
        ctx.stroke();

        // Letra "O" integrada en la cabina
        ctx.fillStyle = WHITE;
        ctx.font = "bold 16px 'Courier New'";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("O", this.width / 2, this.height / 2 + 6);

        // Propulsor
        ctx.fillStyle = ORANGE;
        ctx.fillRect(this.width / 2 - 4, this.height, 8, 6);

        ctx.restore();
    }

    update() {
        if (keys["ArrowLeft"] && this.x > 10) {
            this.x -= this.speed;
        }
        if (keys["ArrowRight"] && this.x + this.width < canvas.width - 10) {
            this.x += this.speed;
        }
    }
}

class Enemy {
    constructor(x, y, character, color) {
        this.x = x;
        this.y = y;
        this.character = character; 
        this.color = color;
        this.width = 45; 
        this.height = 30; 
        this.animationOffset = Math.random() * 10; 
    }

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);

        // Tenazas superiores (Mismo color que el cuerpo)
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.width / 2 - 14, this.height / 2 - 4, 6, 0, Math.PI * 2);
        ctx.arc(this.width / 2 + 14, this.height / 2 - 4, 6, 0, Math.PI * 2);
        ctx.fill();

        // Caparazón del Cangrejo (Base circular)
        ctx.beginPath();
        ctx.arc(this.width / 2, this.height / 2 + 4, 15, 0, Math.PI * 2);
        ctx.fill();

        // Patas dinámicas submarinas
        let wave = Math.sin(Date.now() * 0.01 + this.animationOffset) * 3;
        ctx.strokeStyle = this.color;
        ctx.lineWidth = 3;

        // Patas izquierdas
        ctx.beginPath();
        ctx.moveTo(this.width / 2 - 10, this.height / 2 + 5);
        ctx.lineTo(0, this.height + wave);
        ctx.moveTo(this.width / 2 - 10, this.height / 2 + 8);
        ctx.lineTo(-4, this.height + 4 - wave);
        ctx.stroke();

        // Patas derechas
        ctx.beginPath();
        ctx.moveTo(this.width / 2 + 10, this.height / 2 + 5);
        ctx.lineTo(this.width, this.height + wave);
        ctx.moveTo(this.width / 2 + 10, this.height / 2 + 8);
        ctx.lineTo(this.width + 4, this.height + 4 - wave);
        ctx.stroke();

        // Ojos del cangrejo encima del caparazón
        ctx.fillStyle = WHITE;
        ctx.beginPath();
        ctx.arc(this.width / 2 - 6, this.height / 2 - 8, 3, 0, Math.PI * 2);
        ctx.arc(this.width / 2 + 6, this.height / 2 - 8, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "black";
        ctx.beginPath();
        ctx.arc(this.width / 2 - 6, this.height / 2 - 8, 1, 0, Math.PI * 2);
        ctx.arc(this.width / 2 + 6, this.height / 2 - 8, 1, 0, Math.PI * 2);
        ctx.fill();

        // TEXTO QUÍMICO INTEGRADO (H, C, Fe) en el centro del caparazón
        ctx.fillStyle = WHITE;
        ctx.font = "bold 14px 'Courier New'";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(this.character, this.width / 2, this.height / 2 + 6);

        ctx.restore();
    }
}

class Laser {
    constructor(x, y) {
        this.width = 4;
        this.height = 15;
        this.x = x - this.width / 2;
        this.y = y - this.height;
        this.speed = -9;
    }

    draw() {
        ctx.fillStyle = YELLOW;
        ctx.shadowBlur = 8;
        ctx.shadowColor = YELLOW;
        ctx.fillRect(this.x, this.y, this.width, this.height);
        ctx.shadowBlur = 0; 
    }

    update() {
        this.y += this.speed;
    }
}

// --- INSTANCIAS ---
let player = new Player();
let enemies = [];
let lasers = [];

function createEnemyFleet() {
    enemies = [];
    lasers = [];
    
    let letraEnemigo = "";
    let colorEnemigo = "";

    if (nivel === 1) {
        letraEnemigo = "H"; colorEnemigo = RED;
    } else if (nivel === 2) {
        letraEnemigo = "C"; colorEnemigo = ORANGE;
    } else if (nivel === 3) {
        letraEnemigo = "Fe"; colorEnemigo = RUST;
    } else {
        return;
    }

    const rows = 4;
    const cols = 10;
    const xSpacing = 55;
    const ySpacing = 45;
    const xStart = 130;
    const yStart = 70;

    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
            let x = xStart + c * xSpacing;
            let y = yStart + r * ySpacing;
            enemies.push(new Enemy(x, y, letraEnemigo, colorEnemigo));
        }
    }

    levelStartTime = Date.now();
}

function startGame() {
    inStartMenu = false;
    resetGame();
}

function resetGame() {
    nivel = 1; score = 0; enemiesDestroyed = 0;
    hDestroyed = 0; cDestroyed = 0; feDestroyed = 0;
    enemySpeed = 2; enemyDirection = 1;
    gameOver = false; gameFinished = false; inTransition = false;
    player = new Player();
    createEnemyFleet();
}

function rectCollision(rect1, rect2) {
    return rect1.x < rect2.x + rect2.width &&
           rect1.x + rect1.width > rect2.x &&
           rect1.y < rect2.y + rect2.height &&
           rect1.y + rect1.height > rect2.y;
}

// --- EVENTOS DEL TECLADO Y MOUSE ---
window.addEventListener("keydown", (e) => {
    keys[e.key] = true;
    
    if (inStartMenu && (e.key === " " || e.key === "Enter")) {
        startGame();
        return;
    }

    if (e.key === " " && !gameOver && !inTransition && !gameFinished && !inStartMenu) {
        lasers.push(new Laser(player.x + player.width / 2, player.y));
    }
    if ((e.key === "r" || e.key === "R") && (gameOver || gameFinished)) {
        resetGame();
    }
});

window.addEventListener("keyup", (e) => { keys[e.key] = false; });

// Click del mouse para presionar el botón
canvas.addEventListener("click", (e) => {
    if (inStartMenu) {
        const rect = canvas.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;

        if (
            mouseX >= startButton.x &&
            mouseX <= startButton.x + startButton.width &&
            mouseY >= startButton.y &&
            mouseY <= startButton.y + startButton.height
        ) {
            startGame();
        }
    }
});

// Cambiar cursor sobre el botón
canvas.addEventListener("mousemove", (e) => {
    if (inStartMenu) {
        const rect = canvas.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;

        if (
            mouseX >= startButton.x &&
            mouseX <= startButton.x + startButton.width &&
            mouseY >= startButton.y &&
            mouseY <= startButton.y + startButton.height
        ) {
            canvas.style.cursor = "pointer";
        } else {
            canvas.style.cursor = "default";
        }
    } else {
        canvas.style.cursor = "default";
    }
});

// --- DIBUJAR PANTALLA DE INICIO ---
function drawStartMenu() {
    ctx.textAlign = "center";
    
    // Título
    ctx.fillStyle = CYAN;
    ctx.font = "bold 28px 'Courier New'";
    ctx.fillText("INVASIÓN DE CANGREJOS QUÍMICOS", canvas.width / 2, 70);
    
    ctx.fillStyle = WHITE;
    ctx.font = "bold 18px 'Courier New'";
    ctx.fillText("--- MAR PROFUNDO ---", canvas.width / 2, 100);

    // Explicación
    ctx.fillStyle = WHITE;
    ctx.font = "15px 'Courier New'";
    ctx.fillText("Misión: Pilota la nave de Oxígeno (O) para neutralizar", canvas.width / 2, 150);
    ctx.fillText("las hordas de Cangrejos Químicos en el fondo marino.", canvas.width / 2, 175);
    ctx.fillText("Elimina elementos para sintetizar moléculas compuestas.", canvas.width / 2, 200);

    // Controles
    ctx.fillStyle = YELLOW;
    ctx.font = "bold 16px 'Courier New'";
    ctx.fillText("CONTROLES:", canvas.width / 2, 250);
    
    ctx.fillStyle = WHITE;
    ctx.font = "14px 'Courier New'";
    ctx.fillText("Flechas [Izquierda / Derecha] : Mover nave", canvas.width / 2, 280);
    ctx.fillText("Barra Espaciadora : Disparar láser de Oxígeno", canvas.width / 2, 305);
    ctx.fillText("Tecla [R] : Reiniciar tras perder o ganar", canvas.width / 2, 330);

    // Botón Iniciar
    ctx.fillStyle = HERO_BLUE;
    ctx.fillRect(startButton.x, startButton.y, startButton.width, startButton.height);
    
    ctx.strokeStyle = WHITE;
    ctx.lineWidth = 2;
    ctx.strokeRect(startButton.x, startButton.y, startButton.width, startButton.height);

    ctx.fillStyle = WHITE;
    ctx.font = "bold 20px 'Courier New'";
    ctx.fillText("INICIAR JUEGO", canvas.width / 2, startButton.y + 32);

    ctx.fillStyle = GREEN;
    ctx.font = "13px 'Courier New'";
    ctx.fillText("O presiona BARRA ESPACIADORA para comenzar", canvas.width / 2, 490);

    // Créditos institucionales
    ctx.fillStyle = CYAN;
    ctx.font = "12px 'Courier New'";
    ctx.fillText("Trabajo realizado por los estudiantes de 5to año del Instituto Joaquín V. González", canvas.width / 2, 545);
    ctx.fillText("materia: \"Construcción de la Práctica Docente y Residencia - Año 2026\"", canvas.width / 2, 565);
}

// --- BUCLE PRINCIPAL (LOOP) ---
function gameLoop() {
    const currentTime = Date.now();

    // Actualizar burbujas 
    for (let bubble of bubbles) {
        bubble.y -= bubble.speed;
        if (bubble.y < 0) {
            bubble.y = canvas.height;
            bubble.x = Math.random() * canvas.width;
        }
    }

    // Renderizar fondo común
    ctx.fillStyle = "#0a1e3f";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Dibujar burbujas de fondo
    ctx.fillStyle = "rgba(255, 255, 255, 0.15)";
    for (let bubble of bubbles) {
        ctx.beginPath();
        ctx.arc(bubble.x, bubble.y, bubble.radius, 0, Math.PI * 2);
        ctx.fill();
    }

    // Verificar si estamos en la pantalla de inicio
    if (inStartMenu) {
        drawStartMenu();
        requestAnimationFrame(gameLoop);
        return;
    }

    // 1. Lógica del Juego
    if (!gameOver && !gameFinished) {
        if (inTransition) {
            if (currentTime - transitionTimer >= TRANSITION_DURATION) {
                inTransition = false;
                if (nivel > 3) gameFinished = true;
                else createEnemyFleet();
            }
        } else {
            let timePassed = currentTime - levelStartTime;
            if (timePassed >= LEVEL_DURATION) gameOver = true;

            player.update();

            // Actualizar láseres
            for (let i = lasers.length - 1; i >= 0; i--) {
                lasers[i].update();
                if (lasers[i].y + lasers[i].height < 0) lasers.splice(i, 1);
            }

            // Movimiento lateral e inferior de los cangrejos
            let moveDown = false;
            for (let enemy of enemies) {
                if (enemy.x + enemy.width >= canvas.width - 10 || enemy.x <= 10) {
                    moveDown = true;
                    break;
                }
            }

            if (moveDown) {
                enemyDirection *= -1;
                for (let enemy of enemies) {
                    enemy.y += enemyDrop;
                    if (enemy.y + enemy.height >= player.y) gameOver = true;
                }
            }

            for (let enemy of enemies) {
                enemy.x += enemyDirection * enemySpeed;
            }

            // Colisión Láseres vs Cangrejos
            for (let l = lasers.length - 1; l >= 0; l--) {
                for (let e = enemies.length - 1; e >= 0; e--) {
                    if (rectCollision(lasers[l], enemies[e])) {
                        score += 100;
                        enemiesDestroyed += 1;
                        
                        if (nivel === 1) hDestroyed++;
                        else if (nivel === 2) cDestroyed++;
                        else if (nivel === 3) feDestroyed++;

                        enemies.splice(e, 1);
                        lasers.splice(l, 1);
                        break; 
                    }
                }
            }

            // Subir de nivel si la zona queda limpia
            if (enemies.length === 0 && !inTransition) {
                inTransition = true;
                transitionTimer = currentTime;
                nivelCompletadoAnterior = nivel;
                nivel += 1;
                enemySpeed += 1.0;
            }

            // Colisión directa Cangrejo vs Nave
            for (let enemy of enemies) {
                if (rectCollision(player, enemy)) gameOver = true;
            }
        }
    }

    // 2. Renderizado / Pintar Pantalla
    if (gameFinished) {
        ctx.textAlign = "center";
        ctx.fillStyle = GREEN; ctx.font = "bold 40px 'Courier New'";
        ctx.fillText("FIN DE JUEGO", canvas.width / 2, 220);
        ctx.fillStyle = WHITE; ctx.font = "bold 28px 'Courier New'";
        ctx.fillText("¡Felicidades, Laboratorio Limpio!", canvas.width / 2, 300);
        ctx.fillStyle = YELLOW; ctx.font = "bold 24px 'Courier New'";
        ctx.fillText("Presiona R para volver a jugar", canvas.width / 2, 400);

    } else if (inTransition) {
        let tiempoRestante = Math.max(0, Math.ceil((TRANSITION_DURATION - (currentTime - transitionTimer)) / 1000));
        ctx.textAlign = "center";

        if (nivelCompletadoAnterior === 1) {
            let moleculasAgua = Math.floor(hDestroyed / 2);
            ctx.fillStyle = GREEN; ctx.font = "bold 28px 'Courier New'";
            ctx.fillText("¡NIVEL 1 COMPLETADO!", canvas.width / 2, 180);
            ctx.fillStyle = WHITE;
            ctx.fillText(`Cangrejos de Hidrógeno (H) eliminados: ${hDestroyed}`, canvas.width / 2, 240);
            ctx.fillStyle = CYAN;
            ctx.fillText(`¡Formaste ${moleculasAgua} moléculas de Agua (H2O)!`, canvas.width / 2, 290);
            ctx.fillStyle = YELLOW; ctx.font = "bold 24px 'Courier New'";
            ctx.fillText(`Siguiente oleada en ${tiempoRestante} segundos...`, canvas.width / 2, 420);
            
        } else if (nivelCompletadoAnterior === 2) {
            let moleculasCo2 = cDestroyed;
            ctx.fillStyle = GREEN; ctx.font = "bold 28px 'Courier New'";
            ctx.fillText("¡NIVEL 2 COMPLETADO!", canvas.width / 2, 180);
            ctx.fillStyle = WHITE;
            ctx.fillText(`Cangrejos de Carbono (C) eliminados: ${cDestroyed}`, canvas.width / 2, 240);
            ctx.fillStyle = ORANGE;
            ctx.fillText(`¡Formaste ${moleculasCo2} moléculas de CO2!`, canvas.width / 2, 290);
            ctx.fillStyle = YELLOW; ctx.font = "bold 24px 'Courier New'";
            ctx.fillText(`Siguiente oleada en ${tiempoRestante} segundos...`, canvas.width / 2, 420);
            
        } else if (nivelCompletadoAnterior === 3) {
            let oxidoHierro = Math.floor(feDestroyed / 2);
            ctx.fillStyle = GREEN; ctx.font = "bold 28px 'Courier New'";
            ctx.fillText("¡NIVEL 3 COMPLETADO!", canvas.width / 2, 180);
            ctx.fillStyle = WHITE;
            ctx.fillText(`Cangrejos de Hierro (Fe) eliminados: ${feDestroyed}`, canvas.width / 2, 240);
            ctx.fillStyle = RUST;
            ctx.fillText(`¡Formaste ${oxidoHierro} moléculas de Óxido de Hierro!`, canvas.width / 2, 290);
            ctx.fillStyle = YELLOW; ctx.font = "bold 24px 'Courier New'";
            ctx.fillText(`Calculando resultados en ${tiempoRestante} segundos...`, canvas.width / 2, 420);
        }

    } else {
        // JUEGO NORMAL
        player.draw();
        for (let enemy of enemies) enemy.draw();
        for (let laser of lasers) laser.draw();

        // --- INTERFAZ DE USUARIO (UI) ---
        ctx.textAlign = "left";
        ctx.fillStyle = WHITE; ctx.font = "bold 24px 'Courier New'";
        ctx.fillText(`PUNTOS: ${score}`, 20, 35);

        ctx.textAlign = "center";
        ctx.fillStyle = GREEN;
        ctx.fillText(`NIVEL: ${nivel}`, canvas.width / 2, 35);

        let levelTimeLeft = 0;
        if (!gameOver) {
            levelTimeLeft = Math.max(0, Math.ceil((LEVEL_DURATION - (currentTime - levelStartTime)) / 1000));
        }

        ctx.textAlign = "right";
        ctx.fillStyle = (levelTimeLeft <= 5) ? RED : YELLOW;
        ctx.fillText(`TIEMPO: ${levelTimeLeft}s`, canvas.width - 20, 35);

        ctx.fillStyle = WHITE;
        ctx.fillText(`BAJAS: ${enemiesDestroyed}`, canvas.width - 20, 65);

        if (gameOver) {
            ctx.textAlign = "center";
            ctx.fillStyle = RED;
            ctx.fillText("GAME OVER - Presiona R para reiniciar", canvas.width / 2, canvas.height / 2);
        }
    }

    requestAnimationFrame(gameLoop);
}

// Inicializar ciclo de juego
requestAnimationFrame(gameLoop);
</script>

</body>
</html>
